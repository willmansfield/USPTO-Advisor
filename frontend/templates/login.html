<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USPTO Patent AI — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a3a5c 0%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.20);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
            margin: 20px;
        }

        .login-header {
            background: white;
            padding: 44px 36px 24px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .logo-mark {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #1a3a5c, #2563eb);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 26px;
            color: white;
        }

        .login-title {
            color: #1a1a2e;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .login-subtitle {
            color: #6b7280;
            font-size: 14px;
            font-weight: 400;
        }

        .login-form { padding: 32px 36px; }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            color: #111827;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .login-button {
            width: 100%;
            background: linear-gradient(135deg, #1a3a5c, #2563eb);
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 0.2px;
        }

        .login-button:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
        .login-button:active:not(:disabled) { transform: translateY(0); }
        .login-button:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-top: 12px;
            padding: 10px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .login-footer {
            padding: 18px 36px;
            background: #f9fafb;
            text-align: center;
            border-top: 1px solid #f0f0f0;
        }

        .footer-text { color: #9ca3af; font-size: 12px; }

        @media (max-width: 480px) {
            .login-header, .login-form, .login-footer { padding-left: 24px; padding-right: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-mark">⚖</div>
            <h1 class="login-title">USPTO Patent AI</h1>
            <p class="login-subtitle">Sign in to access live patent intelligence</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Enter username"
                       autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-button" id="loginBtn">Sign In</button>
            <div class="error-message" id="errorMsg"></div>
        </form>

        <div class="login-footer">
            <p class="footer-text">Powered by USPTO Open Data Portal &amp; OpenAI</p>
        </div>
    </div>

    <script>
        const form  = document.getElementById('loginForm');
        const btn   = document.getElementById('loginBtn');
        const errEl = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) { showError('Please enter both username and password.'); return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Signing in…';
            errEl.style.display = 'none';

            try {
                const res  = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.message || 'Login failed. Please check your credentials.');
                }
            } catch (err) {
                showError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        function showError(msg) {
            errEl.textContent = msg;
            errEl.style.display = 'block';
        }

        document.getElementById('username').addEventListener('input', () => errEl.style.display = 'none');
        document.getElementById('password').addEventListener('input', () => errEl.style.display = 'none');

        document.addEventListener('DOMContentLoaded', () => document.getElementById('username').focus());
    </script>
</body>
</html>
